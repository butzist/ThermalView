[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thermalview-usb"
version = "0.1.0"
description = "Python driver for the ThermalView USB thermal adapter (32x32, CH340-class)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "pyserial>=3.5",
  "numpy>=1.24",
  "Pillow>=9.0",
]

[project.optional-dependencies]
usb = ["pyusb>=1.2"]
test = ["pytest>=7"]

[project.scripts]
thermalview = "thermalview.cli:main"

[tool.setuptools.packages.find]
include = ["thermalview*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
